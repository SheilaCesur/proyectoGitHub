name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Incrementar AppVersion en el README
        run: |
          ACTUAL=$(grep -oP 'AppVersion-\K[0-9]+' README.md | head -n1)
          NUEVA=$((ACTUAL + 1))
          FECHA=$(date '+%Y-%m-%d %H:%M:%S')
          sed -i "s/AppVersion-${ACTUAL}.*/AppVersion-${NUEVA} (actualizado: ${FECHA})/" README.md

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "cd: bump de versión [skip ci]" || echo "Sin cambios que commitear"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}

  validate-prod:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref || github.ref_name }}
      - name: Validar PROD_TOKEN contra LOCAL_PROD_TOKEN
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if [ "$PROD_TOKEN" != "$LOCAL_PROD_TOKEN" ]; then
            echo "PROD_TOKEN no coincide con LOCAL_PROD_TOKEN"
            exit 1
          fi
          echo "Token correcto"