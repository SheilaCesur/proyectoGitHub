name: CD

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-version:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar versión
        run: |
          VERSION=$(grep -o 'AppVersion-[0-9]*' README.md | tail -1 | sed 's/AppVersion-//')
          NEW_VERSION=$((VERSION + 1))
          sed -i "s/AppVersion-$VERSION/AppVersion-$NEW_VERSION/" README.md
          echo "Versión actualizada a AppVersion-$NEW_VERSION"
          echo "Fecha: $(date)" >> README.md

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualiza versión de la aplicación" || echo "No hay cambios"
          git push

  validate-prod:
    needs: update-version
    runs-on: self-hosted

    steps:
      - name: Validar PROD_TOKEN
        run: |
          if [ "$PROD_TOKEN" = "${{ secrets.PROD_TOKEN }}" ]; then
            echo "PROD_TOKEN válido"
          else
            echo "PROD_TOKEN no coincide"
            exit 1
          fi